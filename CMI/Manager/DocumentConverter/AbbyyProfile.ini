; ==========================================================
; ABBYY FineReader Engine 12.7.x – OCR-Profil
; Kompatibel mit LoadProfileFromFile in Engine 12.7.x
; ==========================================================

[RecognizerParams]
; Aktiviert automatische Spracherkennung (empfohlen)
LanguageDetectionMode = TSPV_Yes

; Liste der zulässigen Sprachen
TextLanguage = German,GermanNewSpelling,French,Italian,English,RhaetoRomanic

; Texttypen für bessere Erkennung von Schreibmaschine oder Fraktur
; (TT_Gothic erfordert entsprechende Lizenz)
TextTypes = TT_Normal,TT_Typewriter

; Optionale zusätzliche Parameter (alle gültig in Engine 15)
; DetectBarcodes = Yes
; DetectPictures = Yes
; DetectTables = Yes

[EmptyPageDetectionParams]
; allows up to five letters in the page backside
MaxAlphabetLetters = 5

; allows a lot of “garbage text” objects on empty pages
; Specifies the maximum number of text objects found on the page, for which it can still be considered empty.
; It can take values from -1 (which means that the text object limit is not used) to 100.
; The default value of this property is 20.
MaxTextObjects = -1

[PagePreprocessingParams]
; Hinweis: Der alte Abschnitt [PrepareImageMode] wurde ersetzt.
; Use the CorrectSkew property of the PagePreprocessingPara ms object instead.
 CorrectSkewMode = CSM_Off
 CorrectOrientationMode = COM_No
 CorrectGeometry = TSPV_No

; Farbtiefe und Qualität können optional eingestellt werden
; Deskew = No
; RemoveGarbage = Yes
; RemoveTexture = Yes

[PDFExportParams]
; verhindert, dass ABBYY Bilder mit weißem Hintergrund konvertiert
CorrectColorDepth = false

; Optionale neue Parameter (gültig in ABBYY 15)
; PDFImageCompression = Auto
; PDFTextLayer = True
; PDFUseMRCCompression = True
