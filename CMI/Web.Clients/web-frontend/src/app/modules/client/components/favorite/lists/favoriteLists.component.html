<div class="list-favorite-lists">
  <div class="header">
    <a [routerLink]="getFavoritesLink()">{{'Favoritenlisten' | translate:'favorites.listsTitle' }}<span
    class="icon icon--star pull-right" role="img" aria-hidden="true"></span></a>
  </div>
  <ul>
    @for (list of lists; track list) {
      <li (click)="goTo(list)" [ngClass]="{'active': list.active}">
        <!-- order important for right float -->
        <div class="badge">{{ list.numberOfItems }}</div>
        @if (!list.active) {
          <a  href="javascript:void(0)">{{ list.name }}</a>
        }
        @if (list.active) {
          <span>{{ list.name }}<span class="sr-only"> active</span></span>
        }
      </li>
    }
  </ul>
</div>
