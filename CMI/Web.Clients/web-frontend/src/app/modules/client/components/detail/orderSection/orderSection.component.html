<div class="order-section">
  @if (authenticated) {
    <cmi-viaduc-usage-section
      [text]="'Legen Sie die Unterlagen in den Bestellkorb, um sie dort direkt zu bestellen oder ein Einsichtsgesuch einzureichen.' | translate:'orderSection.orderText'">
      <a class="btn w-100" (keyup.enter)="orderVe()" (click)="orderVe()" tabindex="0">
        <span class="icon icon--cart" role="img" aria-hidden="true"></span>&nbsp;
        <span>{{ 'Bestellen' | translate:'file.order' }} </span>
      </a>
    </cmi-viaduc-usage-section>
  }
  @if (!authenticated) {
    <cmi-viaduc-usage-section [text]="pleaseLoginText">
      <a class="btn w-100" (click)="login($event)" tabindex="0" (keyup.enter)="login($event)">
        <i class="glyphicon glyphicon-log-in" role="img" aria-hidden="true" ></i>&nbsp;
        <span>{{ 'Anmelden' | translate:'anmelden' }}</span>
      </a>
    </cmi-viaduc-usage-section>
  }
</div>
