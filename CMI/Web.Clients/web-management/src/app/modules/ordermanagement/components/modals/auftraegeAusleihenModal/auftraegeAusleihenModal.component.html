@if (ids && ids.length > 0) {
  <cmi-viaduc-modal [(opened)]="open" [modalTitle]="ids.length === 1 ? 'Auftrag ausleihen': 'Aufträge ausleihen'">
    @if (isLoading) {
      <cmi-blocker class="cmi-visible cmi-fixed cmi-center cmi-shadow modal-loading-blocker">
        <cmi-spinner [hint]="'Statusänderung wird durchgeführt...'"></cmi-spinner>
      </cmi-blocker>
    }
    <cmi-viaduc-modal-body>
      @if (ids.length > 1) {
        <p>Wollen Sie die {{ids.length}} markierten Aufträge wirklich ausleihen?</p>
      } @else {
        <p>Wollen Sie den Auftrag wirklich ausleihen?</p>
      }
    </cmi-viaduc-modal-body>
    <cmi-viaduc-modal-footer>
      <button class="btn btn-default" (click)="cancel()">Abbrechen</button>
      <button class="btn btn-primary" (click)="ok()">Bestätigen</button>
    </cmi-viaduc-modal-footer>
  </cmi-viaduc-modal>
}
