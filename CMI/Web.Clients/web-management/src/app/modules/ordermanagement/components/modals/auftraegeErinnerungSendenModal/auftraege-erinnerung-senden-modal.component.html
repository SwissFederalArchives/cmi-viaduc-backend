@if (ids && ids.length > 0) {
  <cmi-viaduc-modal [(opened)]="open" [modalTitle]="ids.length === 1 ? 'Erinnerung versenden': 'Erinnerungen versenden'">
    @if (isLoading) {
      <cmi-blocker class="cmi-visible cmi-fixed cmi-center cmi-shadow modal-loading-blocker">
        <cmi-spinner [hint]="'Erinnerung werden versendet...'"></cmi-spinner>
      </cmi-blocker>
    }
    <cmi-viaduc-modal-body>
      @if (ids.length > 1) {
        <p>Wollen Sie für die {{ids.length}} markierten Aufträge wirklich eine Erinnerung an den / die Benutzer versenden?</p>
      } @else {
        <p>Wollen Sie für den Auftrag wirklich eine Erinnerung an den Benutzer versenden?</p>
      }
    </cmi-viaduc-modal-body>
    <cmi-viaduc-modal-footer>
      <button class="btn btn-default" (click)="cancel()">Abbrechen</button>
      <button class="btn btn-primary" (click)="ok()" >Bestätigen</button>
    </cmi-viaduc-modal-footer>
  </cmi-viaduc-modal>
}
