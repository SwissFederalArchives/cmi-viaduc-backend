@if (items) {
  <div class="detail-hierarchy">
    @for (item of items; track item; let i = $index) {
      <span
        [ngStyle]="{ 'padding-left.em': (inset * i) }">
        <span tabindex="0" [ngClass]="{'selected': (i === items.length -1 ) }">
          @if (item.referenceCode) {
            <span>{{item.referenceCode}}&nbsp;</span>
          }
          <span>{{item.title}}</span>
        </span>
      </span>
    }
  </div>
}
