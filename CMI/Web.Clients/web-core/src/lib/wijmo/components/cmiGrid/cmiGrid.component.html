<div>
  <wj-flex-grid-filter #filter [defaultFilterType]="defaultFilterType" [showSortButtons]="false"></wj-flex-grid-filter>

  @if (displaySelectionColumn) {
    <wj-flex-grid-column [isRequired]="true"
      [width]="50"
      [dataType]="3"
      [allowDragging]="false"
      [header]="' '" align="center">
      <ng-template wjFlexGridCellTemplate [cellType]="'Cell'" let-item="item">
        <input type="checkbox" class="wijmo-grid-checkbox" (click)="addOrRemoveItemFromSelection(item)" [checked]="currentSelection.has(item)">
      </ng-template>
    </wj-flex-grid-column>
  }

  <!-- Der Rest des Wijmo-Grids wird hier injected -->
  <ng-content>

  </ng-content>
</div>
